name: Java server protocol baseline
on:
  pull_request:
  push:
    paths:
      - 'java-server/**'
      - '.github/workflows/java-server.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        shell: bash
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress verify 2>&1 | tee maven-test.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            while IFS= read -r line; do
              message=${line//'%'/'%25'}
              message=${message//$'\r'/'%0D'}
              message=${message//$'\n'/'%0A'}
              echo "::error title=Maven test failure::$message"
            done < <(grep -E '^\[ERROR\]' maven-test.log | tail -20)
          fi
          exit "$status"
