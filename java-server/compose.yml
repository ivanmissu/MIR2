services:
  mir2-server:
    build:
      context: .
    image: mir2-java-server:local
    restart: unless-stopped
    ports:
      - "${MIR2_LOGIN_PORT:-7000}:${MIR2_LOGIN_PORT:-7000}"
      - "${MIR2_SELECT_PORT:-7100}:${MIR2_SELECT_PORT:-7100}"
      - "${MIR2_GAME_PORT:-7200}:${MIR2_GAME_PORT:-7200}"
    environment:
      MIR2_DATABASE: /app/data/mir2.db
      MIR2_LOGIN_PORT: ${MIR2_LOGIN_PORT:-7000}
      MIR2_SELECT_PORT: ${MIR2_SELECT_PORT:-7100}
      MIR2_GAME_PORT: ${MIR2_GAME_PORT:-7200}
      MIR2_ADVERTISED_HOST: ${MIR2_ADVERTISED_HOST:-127.0.0.1}
      MIR2_SERVER_NAME: ${MIR2_SERVER_NAME:-MIR2}
      MIR2_MAP_FILE: ${MIR2_MAP_FILE:-}
      MIR2_MAP_ID: ${MIR2_MAP_ID:-0}
      MIR2_MAP_DIRECTORY: ${MIR2_MAP_DIRECTORY:-}
      MIR2_MAP_ROUTES_FILE: ${MIR2_MAP_ROUTES_FILE:-}
      MIR2_SPAWN_X: ${MIR2_SPAWN_X:-10}
      MIR2_SPAWN_Y: ${MIR2_SPAWN_Y:-10}
      MIR2_WORLD_TICK_MS: ${MIR2_WORLD_TICK_MS:-50}
      MIR2_MONSTER_COUNT: ${MIR2_MONSTER_COUNT:-0}
      MIR2_MONSTER_KIND: ${MIR2_MONSTER_KIND:-chicken}
      MIR2_MONGEN_FILE: ${MIR2_MONGEN_FILE:-}
      MIR2_SAVE_INTERVAL_SECONDS: ${MIR2_SAVE_INTERVAL_SECONDS:-600}
      MIR2_BOOTSTRAP_USER: ${MIR2_BOOTSTRAP_USER:-}
      MIR2_BOOTSTRAP_PASSWORD: ${MIR2_BOOTSTRAP_PASSWORD:-}
      MIR2_MAX_CONNECTIONS_PER_IP: ${MIR2_MAX_CONNECTIONS_PER_IP:-128}
      MIR2_CONNECTION_ATTEMPTS_PER_WINDOW: ${MIR2_CONNECTION_ATTEMPTS_PER_WINDOW:-300}
      MIR2_CONNECTION_ATTEMPT_WINDOW_SECONDS: ${MIR2_CONNECTION_ATTEMPT_WINDOW_SECONDS:-60}
      MIR2_IDLE_TIMEOUT_SECONDS: ${MIR2_IDLE_TIMEOUT_SECONDS:-900}
    volumes:
      - mir2-data:/app/data

volumes:
  mir2-data:
